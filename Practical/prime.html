<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Number Checker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: #764ba2;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #764ba2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #5a3782;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: 600;
            min-height: 27px;
        }

        .prime {
            color: #2e7d32;
        }

        .not-prime {
            color: #c62828;
        }

        .error {
            color: #ef6c00;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Prime Number Checker</h1>
        <div class="input-group">
            <input type="number" id="numberInput" placeholder="Enter a whole number" min="0">
        </div>
        <button onclick="checkPrime()">Check Number</button>
        <div id="result"></div>
    </div>

    <script>
        function checkPrime() {
            const inputField = document.getElementById('numberInput');
            const resultDiv = document.getElementById('result');
            const num = parseInt(inputField.value);
            resultDiv.className = '';
            resultDiv.innerText = '';
            if (isNaN(num)) {
                resultDiv.innerText = "Please enter a valid number.";
                resultDiv.classList.add('error');
                return;
            }
            if (num <= 1) {
                resultDiv.innerText = `${num} is NOT a prime number.`;
                resultDiv.classList.add('not-prime');
                return;
            }
            let isPrime = true;
            for (let i = 2; i <= Math.sqrt(num); i++) {
                if (num % i === 0) {
                    isPrime = false;
                    break;
                }
            }
            if (isPrime) {
                resultDiv.innerText = ` Yes! ${num} is a prime number.`;
                resultDiv.classList.add('prime');
            } else {
                resultDiv.innerText = ` No. ${num} is NOT a prime number.`;
                resultDiv.classList.add('not-prime');
            }
        }
        document.getElementById('numberInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                checkPrime();
            }
        });
    </script>

</body>
</html>
